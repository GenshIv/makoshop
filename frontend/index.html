<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="mylead-verification" content="7bc06fe7286b5ce1f518b4c133a2c106" />
    <meta name="description" content="wszyst.pl — онлайн-каталог товаров от проверенных продавцов" />
    <title>wszyst.pl</title>
    <!-- JSON-LD placeholder — Googlebot sees this immediately, JS updates it -->
    <script type="application/ld+json" id="dsh-jsonld-placeholder">{"@context":"https://schema.org","@type":"WebPage"}</script>
    <script>
      // Apply saved theme before paint to avoid FOUC
      (function () {
        try {
          var saved = localStorage.getItem('makoshop_theme');
          var theme = saved || 'auto';
          var effective =
            theme === 'auto'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : theme;
          document.documentElement.classList.add('theme-' + effective);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <!-- JSON-LD for Googlebot — in body so it's in initial HTML -->
    <script type="application/ld+json" id="dsh-jsonld-body">{"@context":"https://schema.org","@type":"WebPage"}</script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
